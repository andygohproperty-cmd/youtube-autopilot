name: Release approved videos

# Run once after the YouTube API audit passes (and set the repo variable AUDIT_PASSED=true).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_BIZ: ${{ secrets.YT_REFRESH_TOKEN_BIZ }}
          YT_REFRESH_TOKEN_FACTS: ${{ secrets.YT_REFRESH_TOKEN_FACTS }}
        run: python -m autopilot.run release-pending
      - run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "history: release pending" && git pull --rebase && git push)
