name: Render style versions

# Renders several versions of a video at once (one runner each) for the owner to pick from.
on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Plan files under versions/, as a JSON list: ["a.json","b.json"]'
        required: true

permissions:
  contents: write
  issues: write

jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(github.event.inputs.files) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # Chatterbox's watermark library fails to load on 3.12
          cache: pip
      - name: Free runner disk (PyTorch for Chatterbox needs room)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install FFmpeg and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts
          python -m playwright install --with-deps chromium
      - name: Cache Chatterbox model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-v1
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Download voice model
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f models/kokoro-v1.0.int8.onnx ] || curl -sSL -o models/kokoro-v1.0.int8.onnx $base/kokoro-v1.0.int8.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin
      - name: Ensure approval label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create approval --color FBCA04 --description "Video waiting for approval" --force
      - name: Render and upload (private, with an approval issue)
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_BIZ: ${{ secrets.YT_REFRESH_TOKEN_BIZ }}
          YT_REFRESH_TOKEN_FACTS: ${{ secrets.YT_REFRESH_TOKEN_FACTS }}
        run: python -m autopilot.run produce --plan-file "versions/${{ matrix.file }}"
      - name: Push a small preview copy (branch previews) for checking
        if: success()
        run: |
          f=$(ls -t out/*/*/final.mp4 out/*/final.mp4 2>/dev/null | head -1); [ -n "$f" ] || exit 0
          name=$(basename "${{ matrix.file }}" .json)
          ffmpeg -loglevel error -y -i "$f" -vf scale=854:-2 -c:v libx264 -preset veryfast -crf 30 -c:a aac -b:a 96k "/tmp/$name.mp4"
          git config user.name "autopilot"; git config user.email "autopilot@users.noreply.github.com"
          git fetch -q origin previews && git worktree add -q /tmp/pv origin/previews -B previews || git worktree add -q --orphan -b previews /tmp/pv
          cp "/tmp/$name.mp4" /tmp/pv/ && cd /tmp/pv && git add "$name.mp4" && git commit -qm "preview: $name"
          for i in 1 2 3 4 5; do git pull -q --rebase origin previews 2>/dev/null; git push -q origin previews && break; sleep $((i * 5)); done
      - name: Save history
        if: always()
        run: |
          git config user.name "autopilot"; git config user.email "autopilot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -m "render: ${{ matrix.file }}"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i * 5)); done
