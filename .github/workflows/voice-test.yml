name: Voice test

# Blind A/B/C test of the free TTS engines on the same script (tools/voice_test.py).
# Clips go to the previews branch under voice-test/; the A/B/C key is only in this log.
on:
  push:
    branches: [claude/project-thread-h43fp9]
    paths: [tools/voice_test.py, .github/workflows/voice-test.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          curl -sSL -o models/kokoro-v1.0.int8.onnx $base/kokoro-v1.0.int8.onnx
          curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin
      - name: Cache Chatterbox models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-turbo-v1
          restore-keys: chatterbox-
      - name: Read the script with each engine
        run: python tools/voice_test.py versions/biz_explainers-20261025-style-magnates-v5.json voice-test
      - name: Push clips to the previews branch
        run: |
          git config user.name "autopilot"; git config user.email "autopilot@users.noreply.github.com"
          git fetch -q origin previews && git worktree add -q -B previews /tmp/pv origin/previews
          mkdir -p /tmp/pv/voice-test && cp voice-test/* /tmp/pv/voice-test/
          cd /tmp/pv && git add voice-test && git commit -qm "voice test clips"
          for i in 1 2 3 4 5; do git pull -q --rebase origin previews 2>/dev/null; git push -q origin previews && break; sleep $((i * 5)); done
