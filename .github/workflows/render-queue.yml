name: Render queued videos

# The scheduled Claude task commits plans to queue/*.json; this renders and uploads them.
on:
  push:
    branches: [main]
    paths: ["queue/*.json"]
  workflow_dispatch:
    inputs:
      sample:
        description: "Render samples/*.json without uploading (quality check)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Free runner disk (PyTorch for Chatterbox needs room)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install FFmpeg and Python packages
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt
          pip install --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts
          python -m playwright install --with-deps chromium
      - name: Cache Chatterbox model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: chatterbox-v1
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Download voice model
        run: |
          mkdir -p models
          base=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -f models/kokoro-v1.0.int8.onnx ] || curl -sSL -o models/kokoro-v1.0.int8.onnx $base/kokoro-v1.0.int8.onnx
          [ -f models/voices-v1.0.bin ] || curl -sSL -o models/voices-v1.0.bin $base/voices-v1.0.bin
      - name: Ensure approval label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create approval --color FBCA04 --description "Video waiting for approval" --force
      - name: Render samples (no upload)
        if: github.event.inputs.sample == 'true'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: for f in samples/*.json; do python -m autopilot.run produce --plan-file "$f" --dry-run; done
      - name: Keep sample videos
        if: github.event.inputs.sample == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sample-videos
          path: |
            out/**/final.mp4
            out/**/thumbnail.jpg
          retention-days: 14
      - name: Render and upload each queued plan
        if: github.event.inputs.sample != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_BIZ: ${{ secrets.YT_REFRESH_TOKEN_BIZ }}
          YT_REFRESH_TOKEN_FACTS: ${{ secrets.YT_REFRESH_TOKEN_FACTS }}
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          mkdir -p queue/done queue/failed
          for f in queue/*.json; do
            [ -e "$f" ] || continue
            if python -m autopilot.run produce --plan-file "$f"; then
              git mv "$f" queue/done/
            else
              git mv "$f" queue/failed/
            fi
          done
      - name: Save history
        if: always() && github.event.inputs.sample != 'true'
        run: |
          git add -A data queue
          git diff --cached --quiet || (git commit -m "render: processed queue" && git pull --rebase && git push)
